name: CI

# When the workflow runs: on pushes to main (including merges), and on pull requests.
# Other branches are checked through their PR, so the same commit is not checked twice.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only needs to read the code
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Same version as local development (nvm reads the same file)
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Checks run from the fastest to the slowest: the first failure stops the job
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Runs in parallel with verify, on its own machine, so it starts from scratch
  e2e:
    runs-on: ubuntu-latest
    # Without a limit a stuck job could hang for the default 6 hours
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner has no browsers; --with-deps also installs the Linux libraries they need
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # The webServer in playwright.config.ts builds and starts the site by itself
      - name: E2E tests
        run: npm run test:e2e

      # Keep the HTML report (screenshots, traces) to see why a test failed
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
